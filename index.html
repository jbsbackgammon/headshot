<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>選手画像作成</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&amp;display=swap">
  <link rel="stylesheet" href="https://jbsbackgammon.github.io/common/ui.css">
  <style>
    /* Shared controls and design tokens live in common/ui.css.
       Only the photo editor's layout, canvas and guides are defined here. */
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }

    .app {
      width: min(var(--width-content-max), calc(100% - 2 * var(--space-16)));
      margin: 0 auto;
      padding: var(--space-24) 0;
    }

    .workspace {
      display: grid;
      grid-template-columns: 340px minmax(0, 1fr);
      gap: var(--space-16);
      align-items: start;
    }

    .control-panel {
      position: sticky;
      top: var(--space-16);
      padding: var(--space-16);
      min-width: 0;
    }

    .jbsui .preview-panel { align-self: start; max-width: 780px; }
    .preview-wrap { width: 100%; margin: 0 auto; }
    .guide-stage { position: relative; width: 100%; padding: var(--space-24); }
    .canvas-box { position: relative; width: 100%; aspect-ratio: 1; }

    .guide-label {
      position: absolute;
      z-index: 3;
      color: var(--color-45);
      font-size: var(--font-size-12);
      line-height: 1.25;
      pointer-events: none;
      white-space: nowrap;
    }
    .guide-label.h1-right, .guide-label.h2-right, .guide-label.h3-right {
      left: calc(100% + var(--space-8));
      transform: translateY(-50%);
      text-align: left;
    }
    .guide-label.h1-right { top: 32px; }
    .guide-label.h2-right { top: 75%; }
    .guide-label.h3-right { top: 50%; }
    .guide-label.v1-bottom, .guide-label.v2-bottom, .guide-label.v3-bottom {
      top: calc(100% + var(--space-8));
      transform: translateX(-50%);
      text-align: center;
    }
    .guide-label.v1-bottom { left: 25%; }
    .guide-label.v2-bottom { left: 75%; }
    .guide-label.v3-bottom { left: 50%; }

    .canvas-shell {
      position: relative;
      width: 100%;
      aspect-ratio: 1;
      overflow: hidden;
      border: var(--width-border) solid var(--color-85);
      background:
        linear-gradient(45deg, var(--color-95) 25%, transparent 25%),
        linear-gradient(-45deg, var(--color-95) 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, var(--color-95) 75%),
        linear-gradient(-45deg, transparent 75%, var(--color-95) 75%),
        var(--color-100);
      background-size: 24px 24px;
      background-position: 0 0, 0 12px, 12px -12px, -12px 0;
      cursor: grab;
      user-select: none;
      touch-action: none;
    }
    .canvas-shell.dragging { cursor: grabbing; }
    .canvas-shell.file-dragover {
      border-color: var(--color-pink);
      box-shadow: inset 0 0 0 var(--width-focus-ring) color-mix(in srgb, var(--color-pink) 12%, transparent);
    }
    canvas { display: block; width: 100%; height: 100%; }
    .reference-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.1;
      pointer-events: none;
      user-select: none;
    }
    .reference-layer[hidden] { display: none; }
    .empty-state {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: var(--space-16);
      text-align: center;
      color: var(--color-45);
      font-size: var(--font-size-14);
      pointer-events: none;
    }
    .empty-state[hidden] { display: none !important; }
    .empty-state strong {
      display: block;
      color: var(--color-25);
      font-size: var(--font-size-16);
      font-weight: var(--font-weight-action);
      margin-bottom: var(--space-8);
    }

    .guide { position: absolute; inset: 0; pointer-events: none; }
    .guide-line {
      position: absolute;
      background: color-mix(in srgb, var(--color-pink) 88%, transparent);
      pointer-events: none;
    }
    .guide-line.vertical { top: 0; bottom: 0; width: var(--width-border); }
    .guide-line.horizontal { left: 0; right: 0; height: var(--width-border); }
    .guide-line.v1 { left: 25%; }
    .guide-line.v2 { left: 75%; }
    .guide-line.v3 { left: 50%; }
    .guide-line.h1 { top: 32px; }
    .guide-line.h2 { top: 75%; }
    .guide-line.h3 { top: 50%; }

    .section + .section, .reference-photo-section {
      border-top: var(--width-border) solid var(--color-85);
      margin-top: var(--space-12);
      padding-top: var(--space-12);
    }
    .section-title, .reference-photo-title {
      margin: 0 0 var(--space-8);
      font-size: var(--font-size-14);
      font-weight: var(--font-weight-action);
    }
    .jbsui .field + .field { margin-top: var(--space-8); }
    .jbsui #nameJa::placeholder,
    .jbsui #nameEn::placeholder {
      color: var(--color-95);
      opacity: 1;
    }
    .file-picker {
      display: grid;
      justify-items: start;
      gap: var(--space-8);
      min-width: 0;
    }
    .jbsui .file-picker .jbsui-file-status {
      max-width: 100%;
      padding: 0;
    }
    .filename {
      margin-top: var(--space-8);
      padding: var(--space-8);
      min-height: var(--height-input);
      border-radius: var(--radius);
      background: var(--color-95);
      color: var(--color-45);
      font-size: var(--font-size-12);
      line-height: 1.45;
      overflow-wrap: anywhere;
    }
    .zoom-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: var(--space-8);
      align-items: center;
    }
    #zoom { accent-color: var(--color-25); }
    .zoom-value {
      min-width: 48px;
      text-align: right;
      font-variant-numeric: tabular-nums;
      font-size: var(--font-size-14);
      color: var(--color-45);
    }
    .pad {
      display: grid;
      grid-template-columns: repeat(3, var(--height-button));
      grid-template-rows: repeat(3, var(--height-button));
      justify-content: center;
      gap: var(--space-4);
      margin-top: var(--space-4);
    }
    .jbsui .pad .jbsui-button { padding: 0; }
    .pad button:nth-child(1) { grid-column: 2; grid-row: 1; }
    .pad button:nth-child(2) { grid-column: 1; grid-row: 2; }
    .pad button:nth-child(3) { grid-column: 2; grid-row: 2; }
    .pad button:nth-child(4) { grid-column: 3; grid-row: 2; }
    .pad button:nth-child(5) { grid-column: 2; grid-row: 3; }
    #download { width: 100%; margin-top: var(--space-8); }

    @media (max-width: 820px) {
      .app { width: min(calc(100% - 2 * var(--space-12)), 680px); padding-top: var(--space-16); }
      .workspace { grid-template-columns: minmax(0, 1fr); }
      .control-panel { position: static; padding: var(--space-12); }
      .jbsui .preview-panel { padding: var(--space-8); }
    }
  </style>
  <link rel="icon" href="https://jbsbackgammon.github.io/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="https://jbsbackgammon.github.io/favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="https://jbsbackgammon.github.io/apple-touch-icon.png">
</head>
<body class="jbsui">
  <main class="app">
    <div class="workspace">
      <aside class="control-panel">
        <section class="section">
          <h2 class="section-title">1. 元写真アップロード</h2>
          <div class="file-picker">
            <input id="fileInput" type="file" accept="image/*" hidden>
            <button class="jbsui-button" id="fileSelectButton" type="button">ファイル選択</button>
            <span class="jbsui-file-status" id="fileStatus">未選択</span>
          </div>
        </section>

        <section class="section adjust-section">
          <h2 class="section-title">2. 位置・大きさ調整</h2>
          <div class="field jbsui-field">
            <div class="zoom-row">
              <input id="zoom" aria-label="拡大縮小" type="range" min="50" max="1000" value="100" step="1" disabled>
              <span class="zoom-value" id="zoomValue">100%</span>
            </div>
          </div>

          <div class="pad" aria-label="画像位置調整">
            <button class="jbsui-button" id="moveUp" type="button" aria-label="上へ">↑</button>
            <button class="jbsui-button" id="moveLeft" type="button" aria-label="左へ">←</button>
            <button class="jbsui-button" id="resetPosition" type="button" aria-label="初期位置に戻す">●</button>
            <button class="jbsui-button" id="moveRight" type="button" aria-label="右へ">→</button>
            <button class="jbsui-button" id="moveDown" type="button" aria-label="下へ">↓</button>
          </div>
        </section>

        <section class="section">
          <h2 class="section-title">3. 顔写真出力</h2>
          <div class="field jbsui-field">
            <input id="nameJa" type="text" placeholder="日本語名" aria-label="日本語名" autocomplete="off">
          </div>
          <div class="field jbsui-field">
            <input id="nameEn" type="text" placeholder="英語名" aria-label="英語名" autocomplete="off">
          </div>
          <div class="filename" id="filenamePreview">未入力.png</div>
          <button class="jbsui-button jbsui-button--primary jbsui-button--primary-action" id="download" type="button" disabled>512×512 PNG出力</button>
          <div class="reference-photo-section">
            <h3 class="reference-photo-title">参考写真</h3>
            <select class="jbsui-select" id="memberSelect" aria-label="選手選択">
              <option value="">選手選択</option>
            </select>
          </div>
        </section>
      </aside>

      <section class="preview-panel jbsui-preview" aria-label="画像プレビュー">
        <div class="preview-wrap">
          <div class="guide-stage">
            <div class="canvas-box">
              <div class="guide-label h1-right">上限</div>
              <div class="guide-label h2-right">顎</div>
              <div class="guide-label h3-right">中央</div>
              <div class="guide-label v1-bottom">耳付近</div>
              <div class="guide-label v2-bottom">耳付近</div>
              <div class="guide-label v3-bottom">中央</div>
              <div class="canvas-shell" id="canvasShell">
                <canvas id="preview" width="512" height="512"></canvas>
                <div class="empty-state" id="emptyState">
                  <div>
                    <strong>写真を選択またはドロップしてください</strong>
                    右のエリアへ画像を直接ドラッグ＆ドロップできます。
                  </div>
                </div>
                <img class="reference-layer" id="referenceLayer" alt="" aria-hidden="true" hidden>
                <div class="guide" id="guide" aria-hidden="true">
                  <span class="guide-line vertical v1"></span>
                  <span class="guide-line vertical v2"></span>
                  <span class="guide-line vertical v3"></span>
                  <span class="guide-line horizontal h1"></span>
                  <span class="guide-line horizontal h2"></span>
                  <span class="guide-line horizontal h3"></span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>

    </div>
  </main>

  <script>
    (() => {
      const SIZE = 512;
      const MOVE_STEP = 4;
      const MEDIAPIPE_CDN = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.32';
      const FACE_MODEL = 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task';
      const LOCAL_VISION = new URL('./assets/mediapipe/', document.baseURI).href.replace(/\/$/, '');
      const LOCAL_MODEL = LOCAL_VISION + '/face_landmarker.task';
      const FACE_OVAL = [10, 338, 297, 332, 284, 251, 389, 356, 454, 323, 361, 288, 397, 365, 379, 378, 400, 377, 152, 148, 176, 149, 150, 136, 172, 58, 132, 93, 234, 127, 162, 21, 54, 103, 67, 109];

      const preview = document.getElementById('preview');
      const ctx = preview.getContext('2d', { alpha: true });
      const canvasShell = document.getElementById('canvasShell');
      const emptyState = document.getElementById('emptyState');
      const referenceLayer = document.getElementById('referenceLayer');
      const fileInput = document.getElementById('fileInput');
      const fileStatus = document.getElementById('fileStatus');
      const zoom = document.getElementById('zoom');
      const zoomValue = document.getElementById('zoomValue');
      const resetPosition = document.getElementById('resetPosition');
      const moveUp = document.getElementById('moveUp');
      const moveDown = document.getElementById('moveDown');
      const moveLeft = document.getElementById('moveLeft');
      const moveRight = document.getElementById('moveRight');
      const nameJa = document.getElementById('nameJa');
      const nameEn = document.getElementById('nameEn');
      const filenamePreview = document.getElementById('filenamePreview');
      const download = document.getElementById('download');
      const memberSelect = document.getElementById('memberSelect');

      const MEMBER_DATA_URL = '/member/data/members.json';

      let image = null;
      let imageUrl = null;
      let baseScale = 1;
      let zoomFactor = 1;
      let offsetX = 0;
      let offsetY = 0;
      let defaultState = null;
      let activePointer = null;
      let dragStart = null;
      let pinchStart = null;
      const pointers = new Map();

      let landmarkerPromise = null;
      let loadRevision = 0;
      let referenceRevision = 0;
      let editRevision = 0;

      function reportAutoPosition(state, details = {}) {
        canvasShell.dataset.autoPosition = state;
        console.info('[headshot] 自動配置:', state, details);
      }

      async function createLandmarker(base, model) {
        const { FilesetResolver, FaceLandmarker } = await import(base + '/vision_bundle.mjs');
        const vision = await FilesetResolver.forVisionTasks(base + '/wasm');
        return FaceLandmarker.createFromOptions(vision, {
          baseOptions: { modelAssetPath: model, delegate: 'CPU' },
          runningMode: 'IMAGE',
          numFaces: 8,
          minFaceDetectionConfidence: 0.4,
          minFacePresenceConfidence: 0.4,
          outputFaceBlendshapes: false,
          outputFacialTransformationMatrixes: false
        });
      }

      function getLandmarker() {
        if (!landmarkerPromise) {
          landmarkerPromise = (async () => {
            // Prefer deployment-bundled assets. The original CDN remains a fallback.
            try {
              const detector = await createLandmarker(LOCAL_VISION, LOCAL_MODEL);
              console.info('[headshot] MediaPipe ready (same origin)');
              return detector;
            } catch (error) {
              console.warn('[headshot] Local MediaPipe unavailable; trying CDN.', error);
              const detector = await createLandmarker(MEDIAPIPE_CDN, FACE_MODEL);
              console.info('[headshot] MediaPipe ready (CDN)');
              return detector;
            }
          })().catch(error => {
            landmarkerPromise = null;
            throw error;
          });
        }
        return landmarkerPromise;
      }

      function sanitizePart(value) {
        return value
          .trim()
          .replace(/[\\/:*?"<>|]/g, '')
          .replace(/\s+/g, ' ');
      }

      function buildFilename() {
        const ja = sanitizePart(nameJa.value);
        const en = sanitizePart(nameEn.value);
        const base = [ja, en].filter(Boolean).join('_') || '未入力';
        const filename = `${base}.png`;
        filenamePreview.textContent = filename;
        return filename;
      }

      function memberAssetUrl(path) {
        const encodedPath = String(path || '')
          .split('/')
          .filter(Boolean)
          .map(part => encodeURIComponent(part))
          .join('/');
        return `/member/${encodedPath}`;
      }

      async function loadMemberList() {
        memberSelect.disabled = true;

        try {
          const response = await fetch(MEMBER_DATA_URL, { cache: 'no-store' });
          if (!response.ok) {
            throw new Error(`選手一覧の取得に失敗しました (${response.status})`);
          }

          const data = await response.json();
          const source = Array.isArray(data) ? data : data?.members;
          if (!Array.isArray(source)) {
            throw new Error('選手一覧の形式が正しくありません。');
          }

          const members = source
            .filter(member => member?.name && member?.nameEn && member?.photo)
            .sort((a, b) => {
              const aJapanese = /[\u3040-\u30ff\u3400-\u9fff]/.test(a.name);
              const bJapanese = /[\u3040-\u30ff\u3400-\u9fff]/.test(b.name);
              if (aJapanese !== bJapanese) return aJapanese ? -1 : 1;
              return String(a.nameEn).localeCompare(String(b.nameEn), 'en', {
                sensitivity: 'base',
                numeric: true
              });
            });

          const fragment = document.createDocumentFragment();
          members.forEach(member => {
            const option = document.createElement('option');
            option.value = JSON.stringify({
              name: member.name,
              nameEn: member.nameEn,
              photo: member.photo
            });
            option.textContent = `${member.name} / ${member.nameEn}`;
            fragment.appendChild(option);
          });

          memberSelect.appendChild(fragment);
          memberSelect.disabled = false;
        } catch (error) {
          console.error(error);
          memberSelect.innerHTML = '<option value="">選手一覧を取得できません</option>';
          memberSelect.disabled = true;
        }
      }

      function clearReference() {
        referenceLayer.hidden = true;
        referenceLayer.removeAttribute('src');
        emptyState.hidden = Boolean(image);
      }

      function loadReferenceImage(member) {
        const revision = ++referenceRevision;
        clearReference();
        if (!member?.photo) return;

        const nextImage = new Image();
        nextImage.onload = () => {
          if (revision !== referenceRevision) return;
          referenceLayer.src = nextImage.src;
          referenceLayer.hidden = false;
          emptyState.hidden = true;
        };
        nextImage.onerror = (error) => {
          if (revision !== referenceRevision) return;
          clearReference();
          console.error('参考写真を読み込めませんでした。', error);
        };
        nextImage.src = memberAssetUrl(member.photo);
      }

      function getDrawState() {
        if (!image) return null;
        const scale = baseScale * zoomFactor;
        const w = image.naturalWidth * scale;
        const h = image.naturalHeight * scale;
        const x = (SIZE - w) / 2 + offsetX;
        const y = (SIZE - h) / 2 + offsetY;
        return { scale, w, h, x, y };
      }

      function getMinimumZoom() {
        if (!image) return .5;
        const coverScale = Math.max(SIZE / image.naturalWidth, SIZE / image.naturalHeight);
        return Math.max(.01, coverScale / baseScale);
      }

      function clampOffsets() {
        if (!image) return;
        const scale = baseScale * zoomFactor;
        const w = image.naturalWidth * scale;
        const h = image.naturalHeight * scale;

        if (w <= SIZE) {
          offsetX = 0;
        } else {
          const limitX = (w - SIZE) / 2;
          offsetX = Math.max(-limitX, Math.min(limitX, offsetX));
        }

        if (h <= SIZE) {
          offsetY = 0;
        } else {
          const limitY = (h - SIZE) / 2;
          offsetY = Math.max(-limitY, Math.min(limitY, offsetY));
        }
      }

      function render() {
        ctx.clearRect(0, 0, SIZE, SIZE);
        if (!image) return;
        clampOffsets();
        const s = getDrawState();
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';
        ctx.drawImage(image, s.x, s.y, s.w, s.h);
      }

      function updateZoomUI() {
        const minPct = Math.max(1, Math.ceil(getMinimumZoom() * 100));
        zoom.min = String(minPct);
        const pct = Math.round(zoomFactor * 100);
        zoom.value = Math.max(minPct, Math.min(Number(zoom.max), pct));
        zoomValue.textContent = `${pct}%`;
      }

      function storeDefault() {
        defaultState = { baseScale, zoomFactor, offsetX, offsetY };
      }

      function restoreDefault() {
        if (!defaultState) return;
        baseScale = defaultState.baseScale;
        zoomFactor = defaultState.zoomFactor;
        offsetX = defaultState.offsetX;
        offsetY = defaultState.offsetY;
        updateZoomUI();
        render();
      }

      function setControlsEnabled(enabled) {
        [zoom, resetPosition, moveUp, moveDown, moveLeft, moveRight, download].forEach(el => el.disabled = !enabled);
      }

      function setInitialCover() {
        const coverScale = Math.max(SIZE / image.naturalWidth, SIZE / image.naturalHeight);
        baseScale = coverScale;
        zoomFactor = 1;
        offsetX = 0;
        offsetY = 0;
        updateZoomUI();
        storeDefault();
        render();
      }

      // Coordinates returned by the model are normalized to the input image.
      // Detect on a bounded-size copy; keep the original for full-quality output.
      function detectionInput(source, region) {
        const ratio = Math.min(1, 1600 / Math.max(region.w, region.h));
        const canvas = document.createElement('canvas');
        canvas.width = Math.max(1, Math.round(region.w * ratio));
        canvas.height = Math.max(1, Math.round(region.h * ratio));
        const context = canvas.getContext('2d', { alpha: false });
        context.fillStyle = '#fff';
        context.fillRect(0, 0, canvas.width, canvas.height);
        context.drawImage(source, region.x, region.y, region.w, region.h, 0, 0, canvas.width, canvas.height);
        return canvas;
      }

      function detectFaces(detector, source) {
        const w = source.naturalWidth, h = source.naturalHeight;
        function detectRegion(region) {
          const result = detector.detect(detectionInput(source, region));
          return (result.faceLandmarks || []).map(points => faceGeometry(points.map(p => ({
            x: (region.x + p.x * region.w) / w,
            y: (region.y + p.y * region.h) / h
          })), w, h)).filter(Boolean);
        }
        const full = detectRegion({ x: 0, y: 0, w, h });
        if (full.length) return full;
        // Retry overlapping regions when faces are too small in the full photo.
        const rw = Math.round(w * 0.65), rh = Math.round(h * 0.65);
        const regions = [
          { x: Math.round((w-rw)/2), y: Math.round((h-rh)/2), w: rw, h: rh },
          ...[0, h-rh].flatMap(y => [0, w-rw].map(x => ({ x, y, w: rw, h: rh })))
        ];
        return regions.flatMap(detectRegion);
      }

      function faceGeometry(points, width, height) {
        if (!points || points.length <= 454) return null;
        const oval = FACE_OVAL.map(index => points[index]);
        if (oval.some(p => !p || !Number.isFinite(p.x) || !Number.isFinite(p.y))) return null;
        const left = Math.min(...oval.map(p => p.x)) * width;
        const right = Math.max(...oval.map(p => p.x)) * width;
        const top = Math.min(...oval.map(p => p.y)) * height;
        const chin = points[152].y * height;
        const faceWidth = right - left;
        const faceHeight = chin - top;
        if (!(faceWidth > 0 && faceHeight > 0)) return null;
        return {
          centerX: (left + right) / 2,
          chin,
          width: faceWidth,
          height: faceHeight,
          // Facial landmarks do not include hair: estimate the crown conservatively.
          crown: top - faceHeight * 0.22,
          area: faceWidth * faceHeight
        };
      }

      function calculatePlacement(face, width, height, upperGuideY) {
        const chinY = SIZE * 0.75;
        const coverScale = Math.max(SIZE / width, SIZE / height);
        const widthScale = (SIZE * 0.5) / face.width;
        const heightScale = (chinY - upperGuideY) / (face.chin - face.crown);
        const preferredScale = Math.max(coverScale, Math.min(widthScale, heightScale));
        // Increase slightly if needed to align the face without exposing blank pixels.
        const alignmentScale = Math.max(
          SIZE / 2 / Math.max(1, face.centerX),
          SIZE / 2 / Math.max(1, width - face.centerX),
          chinY / Math.max(1, face.chin),
          (SIZE - chinY) / Math.max(1, height - face.chin)
        );
        const scale = Math.max(preferredScale, Math.min(alignmentScale, heightScale, preferredScale * 1.15));
        const w = width * scale;
        const h = height * scale;
        return {
          scale,
          x: Math.max(-(w - SIZE) / 2, Math.min((w - SIZE) / 2, SIZE / 2 - face.centerX * scale - (SIZE - w) / 2)),
          y: Math.max(-(h - SIZE) / 2, Math.min((h - SIZE) / 2, chinY - face.chin * scale - (SIZE - h) / 2))
        };
      }

      async function tryAutoPosition(source, revision, edits) {
        const isCurrent = () => image === source && loadRevision === revision && editRevision === edits;
        try {
          const detector = await getLandmarker();
          if (!isCurrent()) {
            if (image === source && loadRevision === revision) reportAutoPosition('manual');
            return false;
          }
          const width = source.naturalWidth;
          const height = source.naturalHeight;
          const faces = detectFaces(detector, source).sort((a, b) => b.area - a.area);
          if (!isCurrent()) return false;
          if (!faces.length) {
            reportAutoPosition('no-face');
            return false;
          }

          const upperGuide = canvasShell.querySelector('.guide-line.h1');
          const upperGuideY = upperGuide && preview.clientHeight
            ? upperGuide.offsetTop * SIZE / preview.clientHeight
            : 32;
          const placement = calculatePlacement(faces[0], width, height, upperGuideY);
          if (!Object.values(placement).every(Number.isFinite) || placement.scale <= 0) {
            reportAutoPosition('invalid-placement');
            return false;
          }

          baseScale = placement.scale;
          zoomFactor = 1;
          offsetX = placement.x;
          offsetY = placement.y;
          updateZoomUI();
          render();
          storeDefault();
          reportAutoPosition('applied', { faces: faces.length, scale: placement.scale, offsetX, offsetY });
          return true;
        } catch (error) {
          // The cover crop remains available if the model or CDN cannot be loaded.
          if (isCurrent()) reportAutoPosition('error');
          console.warn('MediaPipeによる自動配置を利用できませんでした。', error);
          return false;
        }
      }

      function move(dx, dy) {
        if (!image) return;
        editRevision++;
        offsetX += dx;
        offsetY += dy;
        clampOffsets();
        render();
      }

      function setZoom(next, anchor = null) {
        if (!image) return;
        const clamped = Math.max(getMinimumZoom(), Math.min(10, next));
        if (Math.abs(clamped - zoomFactor) < 0.0001) return;
        editRevision++;

        if (!anchor) {
          zoomFactor = clamped;
          updateZoomUI();
          render();
          return;
        }

        const before = getDrawState();
        const imageX = (anchor.x - before.x) / before.scale;
        const imageY = (anchor.y - before.y) / before.scale;
        zoomFactor = clamped;
        const after = getDrawState();
        offsetX += anchor.x - (after.x + imageX * after.scale);
        offsetY += anchor.y - (after.y + imageY * after.scale);
        updateZoomUI();
        render();
      }

      function canvasPointFromEvent(event) {
        const rect = canvasShell.getBoundingClientRect();
        return {
          x: (event.clientX - rect.left) * (SIZE / rect.width),
          y: (event.clientY - rect.top) * (SIZE / rect.height)
        };
      }

      async function loadImageFile(file) {
        if (!file) return;
        fileStatus.textContent = file.name;
        if (file.type && !file.type.startsWith('image/')) {
          return;
        }

        const revision = ++loadRevision;
        if (imageUrl) URL.revokeObjectURL(imageUrl);
        imageUrl = URL.createObjectURL(file);
        const nextImage = new Image();

        nextImage.onload = async () => {
          if (revision !== loadRevision) return;
          image = nextImage;
          emptyState.hidden = true;
          setControlsEnabled(true);
          setInitialCover();

          reportAutoPosition('detecting');
          await tryAutoPosition(nextImage, revision, editRevision);
        };

        nextImage.onerror = (error) => {
          if (revision !== loadRevision) return;
          console.error('画像を読み込めませんでした。', error);
          setControlsEnabled(Boolean(image));
        };

        nextImage.src = imageUrl;
      }

      document.getElementById('fileSelectButton').addEventListener('click', () => fileInput.click());

      fileInput.addEventListener('change', () => {
        loadImageFile(fileInput.files?.[0]);
      });

      memberSelect.addEventListener('change', () => {
        try {
          loadReferenceImage(memberSelect.value ? JSON.parse(memberSelect.value) : null);
        } catch (error) {
          console.error(error);
        }
      });

      ['dragenter', 'dragover'].forEach(type => {
        canvasShell.addEventListener(type, (event) => {
          event.preventDefault();
          event.stopPropagation();
          if (event.dataTransfer) event.dataTransfer.dropEffect = 'copy';
          canvasShell.classList.add('file-dragover');
        });
      });

      ['dragleave', 'drop'].forEach(type => {
        canvasShell.addEventListener(type, (event) => {
          event.preventDefault();
          event.stopPropagation();
          canvasShell.classList.remove('file-dragover');
        });
      });

      canvasShell.addEventListener('drop', (event) => {
        const file = event.dataTransfer?.files?.[0];
        if (file) fileInput.value = '';
        loadImageFile(file);
      });

      zoom.addEventListener('input', () => setZoom(Number(zoom.value) / 100));
      resetPosition.addEventListener('click', () => { editRevision++; offsetX = defaultState?.offsetX ?? 0; offsetY = defaultState?.offsetY ?? 0; render(); });
      moveUp.addEventListener('click', () => move(0, -MOVE_STEP));
      moveDown.addEventListener('click', () => move(0, MOVE_STEP));
      moveLeft.addEventListener('click', () => move(-MOVE_STEP, 0));
      moveRight.addEventListener('click', () => move(MOVE_STEP, 0));

      [nameJa, nameEn].forEach(input => input.addEventListener('input', buildFilename));
      buildFilename();

      canvasShell.addEventListener('wheel', (event) => {
        if (!image) return;
        event.preventDefault();
        const point = canvasPointFromEvent(event);
        const factor = event.deltaY < 0 ? 1.06 : 1 / 1.06;
        setZoom(zoomFactor * factor, point);
      }, { passive: false });

      canvasShell.addEventListener('pointerdown', (event) => {
        if (!image) return;
        editRevision++;
        canvasShell.setPointerCapture(event.pointerId);
        pointers.set(event.pointerId, canvasPointFromEvent(event));
        canvasShell.classList.add('dragging');

        if (pointers.size === 1) {
          activePointer = event.pointerId;
          dragStart = { point: pointers.get(event.pointerId), offsetX, offsetY };
        } else if (pointers.size === 2) {
          const pts = [...pointers.values()];
          const dx = pts[1].x - pts[0].x;
          const dy = pts[1].y - pts[0].y;
          pinchStart = {
            distance: Math.hypot(dx, dy),
            zoom: zoomFactor,
            anchor: { x: (pts[0].x + pts[1].x) / 2, y: (pts[0].y + pts[1].y) / 2 }
          };
        }
      });

      canvasShell.addEventListener('pointermove', (event) => {
        if (!pointers.has(event.pointerId) || !image) return;
        editRevision++;
        pointers.set(event.pointerId, canvasPointFromEvent(event));

        if (pointers.size === 1 && event.pointerId === activePointer && dragStart) {
          const p = pointers.get(event.pointerId);
          offsetX = dragStart.offsetX + (p.x - dragStart.point.x);
          offsetY = dragStart.offsetY + (p.y - dragStart.point.y);
          clampOffsets();
          render();
        } else if (pointers.size >= 2 && pinchStart) {
          const pts = [...pointers.values()].slice(0, 2);
          const dx = pts[1].x - pts[0].x;
          const dy = pts[1].y - pts[0].y;
          const distance = Math.max(1, Math.hypot(dx, dy));
          const anchor = { x: (pts[0].x + pts[1].x) / 2, y: (pts[0].y + pts[1].y) / 2 };
          const nextZoom = pinchStart.zoom * (distance / pinchStart.distance);
          setZoom(nextZoom, anchor);
        }
      });

      function endPointer(event) {
        pointers.delete(event.pointerId);
        if (pointers.size === 0) {
          activePointer = null;
          dragStart = null;
          pinchStart = null;
          canvasShell.classList.remove('dragging');
        } else if (pointers.size === 1) {
          const [id, point] = [...pointers.entries()][0];
          activePointer = id;
          dragStart = { point, offsetX, offsetY };
          pinchStart = null;
        }
      }

      canvasShell.addEventListener('pointerup', endPointer);
      canvasShell.addEventListener('pointercancel', endPointer);

      download.addEventListener('click', () => {
        if (!image) return;
        editRevision++;
        render();
        preview.toBlob((blob) => {
          if (!blob) {
            console.error('PNGの生成に失敗しました。');
            return;
          }
          const link = document.createElement('a');
          const objectUrl = URL.createObjectURL(blob);
          link.href = objectUrl;
          link.download = buildFilename();
          document.body.appendChild(link);
          link.click();
          link.remove();
          setTimeout(() => URL.revokeObjectURL(objectUrl), 1000);
        }, 'image/png');
      });

      // Use the shared keyboard-only focus ring.
      document.addEventListener('keydown', event => {
        if (event.key === 'Tab') document.documentElement.setAttribute('data-jbsui-keyboard-focus', '');
      });
      document.addEventListener('pointerdown', () => document.documentElement.removeAttribute('data-jbsui-keyboard-focus'));
      setControlsEnabled(false);
      loadMemberList();
      // Warm up while the user is choosing a file, not after the first upload.
      getLandmarker().catch(error => console.warn('[headshot] MediaPipe preload failed.', error));
    })();
  </script>
</body>
</html>
